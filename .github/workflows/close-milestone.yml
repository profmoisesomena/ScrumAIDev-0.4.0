name: Auto-manage milestone state

on:
  issues:
    types: [closed, reopened, edited]
  pull_request:
    types: [closed, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  manage-milestone:
    runs-on: ubuntu-latest

    steps:
      - name: Reconcile managed milestone state
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.issue ?? context.payload.pull_request;
            const action = context.payload.action;

            if (action === "edited" && !context.payload.changes?.milestone) {
              console.log("Skipping edit event because milestone metadata did not change.");
              return;
            }

            const milestoneRefs = [];

            if (item?.milestone) {
              milestoneRefs.push(item.milestone);
            }

            if (context.payload.changes?.milestone?.from) {
              milestoneRefs.push(context.payload.changes.milestone.from);
            }

            const uniqueMilestoneNumbers = [...new Set(milestoneRefs.map((milestone) => milestone.number).filter(Boolean))];

            if (uniqueMilestoneNumbers.length === 0) {
              console.log("Skipping because there is no current or previous milestone to reconcile.");
              return;
            }

            const defaults = {
              milestone_auto_management: "opt_in_prefix",
              auto_managed_milestone_prefix: "Sprint:",
              milestone_reopen_policy: "auto_managed_only",
            };

            async function loadManifestDefaults() {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "docs/project_manifest.md",
                  ref: context.payload.repository.default_branch,
                });

                if (Array.isArray(response.data) || !response.data.content) {
                  console.log("Manifest file was not returned as a regular file. Using defaults.");
                  return defaults;
                }

                const manifest = Buffer.from(response.data.content, response.data.encoding).toString("utf8");
                const keys = Object.keys(defaults);
                const resolved = { ...defaults };

                for (const key of keys) {
                  const pattern = new RegExp(`- \\\`${key}\\\`: \\\`([^\\\`]+)\\\``);
                  const match = manifest.match(pattern);
                  if (match) {
                    resolved[key] = match[1].trim();
                  }
                }

                return resolved;
              } catch (error) {
                console.log(`Could not read docs/project_manifest.md. Using defaults. Error: ${error.message}`);
                return defaults;
              }
            }

            const config = await loadManifestDefaults();
            const managedPrefix = config.auto_managed_milestone_prefix || defaults.auto_managed_milestone_prefix;

            function isManagedMilestone(title) {
              if (config.milestone_auto_management === "disabled") {
                return false;
              }

              if (config.milestone_auto_management === "all_milestones") {
                return true;
              }

              return title.startsWith(managedPrefix);
            }

            for (const milestoneNumber of uniqueMilestoneNumbers) {
              const { data: milestone } = await github.rest.issues.getMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestoneNumber,
              });

              if (!isManagedMilestone(milestone.title || "")) {
                console.log(`Skipping milestone "${milestone.title}" because it is not auto-managed by policy.`);
                continue;
              }

              console.log(
                `Managed milestone "${milestone.title}" with state=${milestone.state}, open=${milestone.open_issues}, closed=${milestone.closed_issues}`
              );

              const shouldClose = milestone.open_issues === 0 && milestone.state === "open";
              const reopenAllowed =
                config.milestone_reopen_policy === "always" ||
                config.milestone_reopen_policy === "auto_managed_only";
              const shouldReopen =
                reopenAllowed &&
                milestone.open_issues > 0 &&
                milestone.state === "closed" &&
                (action === "reopened" || action === "edited");

              if (shouldClose) {
                await github.rest.issues.updateMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  milestone_number: milestone.number,
                  state: "closed",
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  body: `Managed milestone closed automatically: [${milestone.title}](${milestone.html_url})`,
                });

                console.log(`Closed managed milestone "${milestone.title}".`);
                continue;
              }

              if (shouldReopen) {
                await github.rest.issues.updateMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  milestone_number: milestone.number,
                  state: "open",
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  body: `Managed milestone reopened automatically: [${milestone.title}](${milestone.html_url})`,
                });

                console.log(`Reopened managed milestone "${milestone.title}".`);
                continue;
              }

              console.log(`No milestone state change was needed for "${milestone.title}".`);
            }
