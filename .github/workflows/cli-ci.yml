name: cli-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cli-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run CLI/runtime tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests_cli -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv .smoke-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            .smoke-venv/Scripts/python -m pip install --no-deps dist/*.whl
            .smoke-venv/Scripts/scrumaidev version
          else
            .smoke-venv/bin/python -m pip install --no-deps dist/*.whl
            .smoke-venv/bin/scrumaidev version
          fi
