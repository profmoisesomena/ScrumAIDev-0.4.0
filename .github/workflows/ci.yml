name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  framework-tests:
    name: framework / gate script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run agileaidev_gate.py unit tests
        run: python -m unittest scripts.test_agileaidev_gate -v
      - name: Run check_agent_docs_sync.py unit tests
        run: python -m unittest scripts.test_check_agent_docs_sync -v
      - name: Check workflows/skills are documented in README.md and AGENTS.md
        run: python scripts/check_agent_docs_sync.py

  detect-capabilities:
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "backend/requirements.txt" ] || [ -f "backend/pyproject.toml" ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "Dockerfile" ] || [ -f "docker-compose.yml" ]; then
            echo "has_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docker=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gates:
    name: quality / ${{ matrix.gate }}
    needs: detect-capabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, test, typecheck, build, validate-contract, test-contract, test-bdd, test-mock]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node when frontend exists
        if: needs.detect-capabilities.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python when backend exists
        if: needs.detect-capabilities.outputs.has_backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        if: needs.detect-capabilities.outputs.has_frontend == 'true'
        shell: bash
        run: |
          if [ -f frontend/pnpm-lock.yaml ]; then
            corepack enable
            pnpm --dir frontend install --frozen-lockfile
          elif [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install
          fi

      - name: Install backend dependencies
        if: needs.detect-capabilities.outputs.has_backend == 'true'
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          elif [ -f backend/pyproject.toml ]; then
            python -m pip install -e backend
          fi

      - name: Run ${{ matrix.gate }}
        shell: bash
        run: make "${{ matrix.gate }}"

  docker:
    name: docker / build
    needs: detect-capabilities
    if: needs.detect-capabilities.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t test-image .
