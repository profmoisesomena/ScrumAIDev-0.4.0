[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrumaidev"
version = "0.4.1"
description = "ScrumAIDev — agile software development process for AI-assisted teams and agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Prof. Moises Omena"}
]
keywords = ["scrum", "ai", "agents", "software-engineering", "opencode", "codex", "claude-code", "antigravity", "agent-harness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.urls]
Author = "https://github.com/profmoisesomena"
Repository = "https://github.com/profmoisesomena/ScrumAIDev-0.4.0"
Changelog = "https://github.com/profmoisesomena/ScrumAIDev-0.4.0/blob/main/CHANGELOG.md"
Releases = "https://github.com/profmoisesomena/ScrumAIDev-0.4.0/releases"

[project.scripts]
scrumaidev = "scrumaidev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrumaidev = [
  "runtime/core/**/*",
  "runtime/core/**/**/*",
  "runtime/core/**/**/**/*",
  "runtime/core/**/**/**/**/*"
]

[tool.pytest.ini_options]
testpaths = ["tests_cli"]
pythonpath = ["src"]
addopts = "-q"
